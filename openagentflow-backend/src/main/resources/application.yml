server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: openagentflow-backend
  main:
    # IDEA启动阶段不打印Spring Boot Banner，请求到达后再由控制台输出链路日志。
    banner-mode: off
  datasource:
    # MySQL 已按要求使用本地 openagentflow 数据库。
    url: ${OAF_MYSQL_URL:jdbc:mysql://localhost:3306/openagentflow?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${OAF_MYSQL_USERNAME:root}
    password: ${OAF_MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # 空库执行全部迁移；既有非空库从V041建立基线后继续执行后续版本。
    enabled: ${OAF_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: ${OAF_FLYWAY_BASELINE_VERSION:41}
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
  data:
    redis:
      # Redis 使用本地默认连接，后续如有密码只需要补充 password。
      host: ${OAF_REDIS_HOST:localhost}
      port: ${OAF_REDIS_PORT:6379}
      database: ${OAF_REDIS_DATABASE:0}
      password: ${OAF_REDIS_PASSWORD:}
      timeout: 3s
  kafka:
    # IDEA 本地启动连接宿主机 9092；Docker 环境通过环境变量覆盖为 kafka:19092。
    bootstrap-servers: ${OAF_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${OAF_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${OAF_KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${OAF_KAFKA_SASL_JAAS_CONFIG:}
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        compression.type: lz4
    consumer:
      group-id: ${OAF_KAFKA_CONSUMER_GROUP:openagentflow-async-workers}
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
        max.poll.interval.ms: 900000
    listener:
      ack-mode: manual_immediate
      concurrency: ${OAF_KAFKA_CONCURRENCY:4}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  otlp:
    tracing:
      endpoint: ${OAF_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: openagentflow-backend
  tracing:
    # 本地默认不导出Trace，避免未启动OpenTelemetry Collector时持续连接4318端口。
    enabled: ${OAF_TRACING_ENABLED:false}
    sampling:
      probability: ${OAF_TRACE_SAMPLING_PROBABILITY:0.1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    # 数据库字段使用下划线，Java 对象使用驼峰，开启后可以自动完成映射。
    map-underscore-to-camel-case: true
    # SQL由安全拦截器输出，禁用MyBatis默认参数日志，避免密码和API Key泄露。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      # 当前 SQL 主键由 MySQL 的 UUID() 默认值生成，插入时后端可以不主动生成 ID。
      id-type: input

openagentflow:
  pagination:
    cursor-secret: ${OAF_CURSOR_SECRET:openagentflow-local-cursor-secret-change-me}
  logging:
    sql-enabled: ${OAF_SQL_LOG_ENABLED:true}
    slow-sql-ms: ${OAF_SLOW_SQL_MS:1000}
    slow-request-ms: ${OAF_SLOW_REQUEST_MS:3000}
  tenancy:
    # 默认强制租户业务请求携带工作空间，避免本地环境因缺少请求头而绕过空间条件。
    require-workspace-context: ${OAF_REQUIRE_WORKSPACE_CONTEXT:true}
  vector-store:
    strict-write: ${OAF_VECTOR_STRICT_WRITE:true}
  observability:
    refresh-ms: ${OAF_METRICS_REFRESH_MS:15000}
  lifecycle:
    retention-enabled: ${OAF_RETENTION_ENABLED:true}
    cleanup-batch-size: ${OAF_RETENTION_BATCH_SIZE:2000}
    trace-retention-days: ${OAF_TRACE_RETENTION_DAYS:90}
    task-log-retention-days: ${OAF_TASK_LOG_RETENTION_DAYS:30}
  document-pipeline:
    embedding-shard-size: ${OAF_DOCUMENT_EMBEDDING_SHARD_SIZE:16}
    reconcile-enabled: ${OAF_DOCUMENT_RECONCILE_ENABLED:true}
    reconcile-delay-ms: ${OAF_DOCUMENT_RECONCILE_DELAY_MS:60000}
    reconcile-stale-minutes: ${OAF_DOCUMENT_RECONCILE_STALE_MINUTES:15}
    reconcile-batch-size: ${OAF_DOCUMENT_RECONCILE_BATCH_SIZE:100}
  runtime:
    accept-traffic: ${OAF_RUNTIME_ACCEPT_TRAFFIC:true}
    cancel-watch-ms: ${OAF_RUNTIME_CANCEL_WATCH_MS:500}
    executor:
      core-size: ${OAF_RUNTIME_CORE_SIZE:16}
      max-size: ${OAF_RUNTIME_MAX_SIZE:64}
      queue-capacity: ${OAF_RUNTIME_QUEUE_CAPACITY:200}
  opensearch:
    enabled: ${OAF_OPENSEARCH_ENABLED:false}
    endpoint: ${OAF_OPENSEARCH_ENDPOINT:http://localhost:9200}
    username: ${OAF_OPENSEARCH_USERNAME:}
    password: ${OAF_OPENSEARCH_PASSWORD:}
  slo:
    evaluate-ms: ${OAF_SLO_EVALUATE_MS:60000}
  async-task:
    # Kafka 分布式任务开关，关闭时仅允许任务入库，不启动消费者。
    enabled: ${OAF_KAFKA_TASK_ENABLED:true}
    topic: ${OAF_KAFKA_TASK_TOPIC:openagentflow.async-task}
    retry-topic-5s: ${OAF_KAFKA_RETRY_TOPIC_5S:openagentflow.async-task.retry-5s}
    retry-topic-30s: ${OAF_KAFKA_RETRY_TOPIC_30S:openagentflow.async-task.retry-30s}
    dead-letter-topic: ${OAF_KAFKA_DLT_TOPIC:openagentflow.async-task.dlt}
    consumer-group: ${OAF_KAFKA_CONSUMER_GROUP:openagentflow-async-workers}
    partitions: ${OAF_KAFKA_TASK_PARTITIONS:6}
    replication-factor: ${OAF_KAFKA_REPLICATION_FACTOR:1}
    min-in-sync-replicas: ${OAF_KAFKA_MIN_INSYNC_REPLICAS:1}
    max-retries: ${OAF_KAFKA_TASK_MAX_RETRIES:3}
    stale-seconds: ${OAF_KAFKA_TASK_STALE_SECONDS:300}
    outbox-batch-size: ${OAF_KAFKA_OUTBOX_BATCH_SIZE:100}
    outbox-max-attempts: ${OAF_KAFKA_OUTBOX_MAX_ATTEMPTS:20}
    outbox-retention-days: ${OAF_KAFKA_OUTBOX_RETENTION_DAYS:7}
    outbox-poll-ms: ${OAF_KAFKA_OUTBOX_POLL_MS:500}
    worker-role: ${OAF_KAFKA_WORKER_ROLE:all}
    consumer-enabled: ${OAF_KAFKA_CONSUMER_ENABLED:true}
    publisher-enabled: ${OAF_KAFKA_PUBLISHER_ENABLED:true}
    max-running-tasks: ${OAF_KAFKA_MAX_RUNNING_TASKS:32}
  mcp:
    # MCP HTTP/SSE/stdio 单次协议请求超时。
    request-timeout-seconds: ${OAF_MCP_REQUEST_TIMEOUT_SECONDS:30}
    # stdio 只允许直接启动白名单命令，不经过 shell 解释器。
    stdio-allowed-commands: ${OAF_MCP_STDIO_ALLOWED_COMMANDS:node,npx,java,python,python3,uv,uvx,docker}
  object-storage:
    # 分布式 Worker 必须从共享对象存储读取上传文档。
    enabled: ${OAF_OBJECT_STORAGE_ENABLED:true}
    endpoint: ${OAF_MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${OAF_MINIO_PUBLIC_ENDPOINT:${OAF_MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${OAF_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${OAF_MINIO_SECRET_KEY:minioadmin}
    bucket: ${OAF_MINIO_BUCKET:openagentflow}
  milvus:
    # 开发环境未启动 Milvus 时可以设置为 false，后端会保留 MySQL 向量兜底并正常启动。
    enabled: ${OAF_MILVUS_ENABLED:true}
    # Milvus 使用本地默认端口，和 SQL 中 vector_store_connection 的种子配置保持一致。
    host: ${OAF_MILVUS_HOST:localhost}
    port: ${OAF_MILVUS_PORT:19530}
    database-name: ${OAF_MILVUS_DATABASE:default}
    username: ${OAF_MILVUS_USERNAME:}
    password: ${OAF_MILVUS_PASSWORD:}
    default-knowledge-collection: ${OAF_MILVUS_KNOWLEDGE_COLLECTION:oaf_knowledge_chunks}
    default-memory-collection: ${OAF_MILVUS_MEMORY_COLLECTION:oaf_agent_memory}
  security:
    secret-encryption-key: ${OAF_SECRET_ENCRYPTION_KEY:}
    # 严格模式下，未声明权限元数据且不属于内置模块策略的业务路由默认拒绝。
    permission-strict-mode: ${OAF_PERMISSION_STRICT_MODE:true}
    # 登录与基础权限已接入 JWT，默认启用接口鉴权。
    auth-enabled: ${OAF_AUTH_ENABLED:true}
    # JWT 签名密钥，生产环境请通过环境变量覆盖。
    jwt-secret: ${OAF_JWT_SECRET:openagentflow-local-dev-secret-change-me}
    # JWT 有效期，默认 24 小时。
    jwt-expire-minutes: ${OAF_JWT_EXPIRE_MINUTES:1440}
    # 需要访问企业内网API时按主机名显式配置，多个值用逗号分隔。
    tool-private-network-allowlist: ${OAF_TOOL_PRIVATE_NETWORK_ALLOWLIST:}
  rag:
    # 默认召回数量，与前端调试面板和知识库检索配置保持一致。
    default-top-k: 5
    default-score-threshold: 0.65
    embedding-qps: ${OAF_EMBEDDING_QPS:8}
    embedding-concurrency: ${OAF_EMBEDDING_CONCURRENCY:4}
    embedding-acquire-timeout-ms: ${OAF_EMBEDDING_ACQUIRE_TIMEOUT_MS:10000}
    allow-local-embedding-fallback: ${OAF_ALLOW_LOCAL_EMBEDDING_FALLBACK:true}
    # 生产环境保持关闭，避免 Milvus 故障时扫描 MySQL embedding_json 放大数据库压力。
    allow-mysql-vector-fallback: ${OAF_ALLOW_MYSQL_VECTOR_FALLBACK:false}
    # P78：查询理解默认开启，最多执行 4 个去重查询变体。
    query-rewrite-enabled: ${OAF_RAG_QUERY_REWRITE_ENABLED:true}
    multi-query-enabled: ${OAF_RAG_MULTI_QUERY_ENABLED:true}
    max-query-variants: ${OAF_RAG_MAX_QUERY_VARIANTS:4}
    rerank-candidate-limit: ${OAF_RAG_RERANK_CANDIDATE_LIMIT:30}
